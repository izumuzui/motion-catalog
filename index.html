<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UIモーションの語彙集。224種類の動きを名前・用途・指示文・ライブプレビュー・コピー可能なCSSつきで一覧できるカタログ。" />
    <meta property="og:title" content="Motion Catalog — UIモーション語彙集" />
    <meta property="og:description" content="224種類のUIモーションを、名前・用途・指示文・CSSつきで掲載。" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181512'/%3E%3Ccircle cx='12' cy='16' r='6' fill='%23ff4f18'/%3E%3Ccircle cx='21' cy='16' r='6' fill='none' stroke='%23faf8f5' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Motion Catalog — UIモーション語彙集</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // Apply saved theme before first paint to avoid a flash
      try {
        const t = localStorage.getItem('mc-theme')
          || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="./">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect width="32" height="32" rx="7" class="logo-bg"/>
            <circle cx="12" cy="16" r="6" class="logo-dot"/>
            <circle cx="21" cy="16" r="6" class="logo-ring"/>
          </svg>
          <span>Motion<em>Catalog</em></span>
        </a>
        <p class="site-header__tagline">UIモーション語彙集 — 動きの名前・用途・指示文・CSS</p>
        <div class="site-header__actions">
          <span class="stat-badge" id="resultCount" aria-live="polite"></span>
          <button class="tool-btn" id="speedToggle" type="button" aria-label="再生速度 1倍" title="再生速度を切り替える">1×</button>
          <button class="tool-btn" id="replayAll" type="button" aria-label="全てのモーションを再生し直す" title="Replay all">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M2 7a5 5 0 1 0 1-3.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M2 2.5v3h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="tool-btn" id="themeToggle" type="button" aria-label="テーマを切り替える" title="Light / Dark">
            <svg class="icon-sun" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 .8v1.7M7 11.5v1.7M13.2 7h-1.7M2.5 7H.8M11.4 2.6l-1.2 1.2M3.8 10.2l-1.2 1.2M11.4 11.4l-1.2-1.2M3.8 3.8L2.6 2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <svg class="icon-moon" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M12 8.5A5.5 5.5 0 0 1 5.5 2 5.5 5.5 0 1 0 12 8.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          </button>
          <a class="tool-btn tool-btn--gh" href="https://github.com/izumuzui/motion-catalog" target="_blank" rel="noopener" aria-label="GitHubリポジトリを開く" title="GitHub">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.5 7.5 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
            </svg>
          </a>
        </div>
      </div>
    </header>

    <div class="reduced-motion-banner" id="reducedMotionBanner" hidden>
      <p>
        <strong>Reduced motion</strong> が有効なため、プレビューを停止しています。
        <button type="button" id="enableMotion">プレビューを表示する</button>
      </p>
    </div>

    <main class="catalog-layout">
      <div class="toolbar" aria-label="絞り込み">
        <div class="toolbar__inner">
          <div class="search-wrap">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input
              id="searchInput"
              class="search-input"
              type="search"
              placeholder="ボタン, トースト, fade, 削除, 生成中…"
              autocomplete="off"
              aria-label="モーションを検索"
            />
            <button class="search-clear" id="searchClear" type="button" aria-label="検索をクリア" hidden>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
            <kbd class="search-kbd" aria-hidden="true">/</kbd>
          </div>
          <div class="filter-section" aria-label="対象コンポーネントで絞り込み">
            <span class="filter-section__label">対象</span>
            <div class="filter-row" id="targetFilters"></div>
          </div>
          <div class="filter-section" aria-label="モーションの種類で絞り込み">
            <span class="filter-section__label">種類</span>
            <div class="filter-row" id="categoryFilters"></div>
          </div>
        </div>
      </div>

      <section class="catalog-grid" id="catalogGrid" aria-live="polite"></section>

      <div class="empty-state" id="emptyState" hidden>
        <p>該当するモーションがありません。</p>
        <button class="tool-btn tool-btn--text" id="resetFilters" type="button">絞り込みをリセット</button>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div>
          <p class="site-footer__title">Motion Catalog</p>
          <p>UIモーションの名前・用途・指示文・CSSを一覧できるオープンソースのリファレンス。カードの指示文をクリックするとコピーできます。</p>
        </div>
        <div>
          <h3>使い方</h3>
          <ol>
            <li>対象コンポーネントと種類で絞り込む</li>
            <li>プレビューで動きを確認する（カード右上で再生し直し）</li>
            <li>指示文または <code>.class</code> ボタンでCSSをコピーする</li>
          </ol>
        </div>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
