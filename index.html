<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UIモーションの語彙集。動きの名前・用途・指示文・プレビューを一覧できるカタログ。" />
    <meta property="og:title" content="Motion Catalog — UIモーション語彙集" />
    <meta property="og:description" content="186種類のUIモーションを、名前・用途・指示文つきで掲載。" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Crect x='8' y='11' width='9' height='9' rx='2' fill='white' opacity='.9'/%3E%3Crect x='19' y='15' width='5' height='5' rx='1' fill='white' opacity='.6'/%3E%3Crect x='8' y='22' width='16' height='2' rx='1' fill='white' opacity='.4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=Shippori+Mincho:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Motion Catalog — UIモーション語彙集</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="/">
          <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <rect width="28" height="28" rx="7" fill="#6366f1"/>
            <rect x="7" y="10" width="8" height="8" rx="2" fill="white" opacity="0.9"/>
            <rect x="17" y="14" width="4" height="4" rx="1" fill="white" opacity="0.6"/>
            <rect x="7" y="20" width="14" height="2" rx="1" fill="white" opacity="0.4"/>
          </svg>
          <span>Motion Catalog</span>
        </a>
        <p class="site-header__tagline">UIモーション語彙集 — 動きの名前・用途・指示文を一覧できるリファレンス</p>
        <div class="site-header__actions">
          <span class="stat-badge"><strong id="totalCount">186</strong> motions</span>
          <span class="stat-badge stat-badge--secondary">19 categories</span>
          <button class="replay-btn" id="replayAll" type="button" aria-label="全てのモーションを再生し直す">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M2 7a5 5 0 1 0 1-3.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M2 2.5v3h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Replay All
          </button>
        </div>
      </div>
    </header>

    <div class="reduced-motion-banner" id="reducedMotionBanner" hidden>
      <p>
        <strong>Reduced motion</strong> が有効なため、プレビューを停止しています。
        <button type="button" id="enableMotion">プレビューを表示する</button>
      </p>
    </div>

    <main class="catalog-layout">
      <div class="toolbar" aria-label="絞り込み">
        <div class="toolbar__inner">
          <div class="search-wrap">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input
              id="searchInput"
              class="search-input"
              type="search"
              placeholder="fade, toast, ローディング, hover, シェイク…"
              autocomplete="off"
            />
          </div>
          <div class="filter-row" id="categoryFilters" role="tablist" aria-label="カテゴリ"></div>
        </div>
      </div>

      <section class="contents-strip" aria-label="カテゴリ一覧" id="summaryStrip"></section>

      <section class="catalog-grid" id="catalogGrid" aria-live="polite"></section>

      <p class="empty-state" id="emptyState" hidden>該当するエントリがありません。</p>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div>
          <div class="logo" style="margin-bottom:10px">
            <svg width="20" height="20" viewBox="0 0 28 28" fill="none" aria-hidden="true">
              <rect width="28" height="28" rx="7" fill="#6366f1"/>
              <rect x="7" y="10" width="8" height="8" rx="2" fill="white" opacity="0.9"/>
              <rect x="17" y="14" width="4" height="4" rx="1" fill="white" opacity="0.6"/>
              <rect x="7" y="20" width="14" height="2" rx="1" fill="white" opacity="0.4"/>
            </svg>
            <span>Motion Catalog</span>
          </div>
          <p>UIモーションの名前・用途・指示文を一覧できる個人製作のリファレンス集。カードの指示文をクリックするとコピーできます。</p>
        </div>
        <div>
          <h3>使い方</h3>
          <ol>
            <li>検索またはフィルターでカテゴリを絞り込む</li>
            <li>プレビューで動きを確認する</li>
            <li>指示文をクリックしてコピー、依頼に貼る</li>
          </ol>
        </div>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
